<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfis Cadastrados</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #ffffff; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #4e5d6c; margin-bottom: 30px; }
        
        .card { 
            background: white; padding: 20px; margin-bottom: 15px; 
            border: 1px solid #eee; border-radius: 15px; 
            width: 100%; max-width: 450px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 6px solid #6a76d4; /* Detalhe azul na lateral */
        }

        .btn-voltar { 
            margin-top: 20px; color: #6a76d4; text-decoration: none; 
            font-weight: bold; padding: 10px 20px; border: 1px solid #6a76d4; 
            border-radius: 10px; transition: 0.3s; 
        }
        .btn-voltar:hover { background: #6a76d4; color: white; }
    </style>
</head>
<body>
    <h1>Perfis Cadastrados</h1>

    {% for perfil in perfis %}
    <div class="card">
        <p><strong>Nome:</strong> {{ perfil.nome }}</p>
        <p><strong>Idade:</strong> {{ perfil.idade }}</p>
        <p><strong>Universidade:</strong> {{ perfil.universidade }}</p>
    </div>
    {% endfor %}

    <a href="/" class="btn-voltar">← Cadastrar Novo</a>
</body>
</html>
