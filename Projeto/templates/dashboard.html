<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f4f4f4;
        }

        tr:hover {
            background-color: #eaeaea;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #764ba2;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Análise de Cliques</h1>

    {% if contagem %}
    <table>
        <tr>
            <th>Elemento</th>
            <th>Texto</th>
            <th>Quantidade de Cliques</th>
        </tr>

        {% for (elemento, texto), quantidade in contagem.items() %}
        <tr>
            <td>{{ elemento }}</td>
            <td>{{ texto if texto else "Sem texto" }}</td>
            <td>{{ quantidade }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
        <p class="empty">Nenhum dado coletado ainda.</p>
    {% endif %}

    <a href="/">⬅ Voltar</a>

</div>

</body>
</html>
