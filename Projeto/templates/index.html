<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE 04</title>
    <style>
        /* Estilo base seguindo suas imagens */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            width: 90%; 
            max-width: 500px; 
            text-align: center;
        }
        h2 { 
            color: #4e5d6c; 
            font-size: 28px; 
            margin-bottom: 25px; 
        }
        .campo { 
            margin-bottom: 15px; 
        }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            color: #555;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #6a76d4;
        }

        /* Botão com o degradê azul/roxo da sua imagem */
        button { 
            width: 180px; 
            padding: 12px; 
            margin-top: 20px;
            background: linear-gradient(to right, #6a76d4, #8b66c4); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 500;
            transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(106, 118, 212, 0.3);
        }
        button:hover { 
            opacity: 0.9; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Perfil do Usuário</h2>
        
        <form id="perfilForm">
            <div class="campo">
                <input type="text" name="nome" placeholder="Nome" required>
            </div>
            <div class="campo">
                <input type="number" name="idade" placeholder="Idade" required>
            </div>
            <div class="campo">
                <select name="universidade" required>
                    <option value="">Selecione sua universidade...</option>
                    <option value="Universidade São Judas Mooca">Universidade São Judas Mooca</option>
                    <option value="USP">USP</option>
                    <option value="UNIP">UNIP</option>
                    <option value="Mackenzie">Mackenzie</option>
                    <option value="Anhembi Morumbi">Anhembi Morumbi</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>
            <button type="submit">Salvar Perfil</button>
        </form>
    </div>

    <script>
        document.getElementById("perfilForm").addEventListener("submit", function(e) {
            e.preventDefault();

            let dados = {
                tipo: "perfil",
                nome: e.target.nome.value,
                idade: e.target.idade.value,
                universidade: e.target.universidade.value
            };

            fetch("/coletar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(dados)
            })
            .then(response => {
                if (response.ok) {
                    // Isso faz a troca de página automática
                    window.location.href = "/usuarios"; 
                } else {
                    alert("Erro ao salvar perfil.");
                }
            })
            .catch(err => console.error("Erro:", err));
        });
    </script>
</body>
</html>
