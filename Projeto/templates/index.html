<!DOCTYPE html>
<html>
<head>
    <title>Teste de Usabilidade</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
        }

        .container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: #444;
        }

        h2 {
            margin-top: 20px;
            color: #555;
        }

        input, select {
            padding: 10px;
            width: 70%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
        }

        button:hover {
            transform: scale(1.05);
        }

        a {
            display: block;
            margin-top: 20px;
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

<h1>PROJETO - ATIVIDADE 04</h1>

<h2>Perfil do Usuário</h2>
<form id="perfilForm">
    <input type="text" name="nome" placeholder="Nome"><br>
    <input type="number" name="idade" placeholder="Idade"><br>
    <select name="nivel">
        <option>Iniciante</option>
        <option>Intermediário</option>
        <option>Avançado</option>
    </select><br>
    <button type="submit">Salvar Perfil</button>
</form>

<p>Este site coleta dados de interação para análise.</p>

<h2>Buscar produto</h2>
<input type="text" placeholder="Digite algo..."><br>

<!-- 🔥 BOTÃO CORRETO -->
<button onclick="irParaProdutos()">Ir para produtos</button>

<h2>Feedback</h2>
<form id="feedbackForm">
    <input type="text" name="problema" placeholder="Digite seu feedback"><br>
    <button type="submit">Enviar</button>
</form>

<a href="/dashboard">Ver Dashboard</a>

</div>

<script src="/static/script.js"></script>

<script>
function irParaProdutos() {
    tarefaConcluida(); // registra tempo
    window.location.href = "/produtos";
}
</script>

</body>
</html>
